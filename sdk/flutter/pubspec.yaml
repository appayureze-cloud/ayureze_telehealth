name: ayureze_telehealth
description: >
  Headless Flutter SDK for AyurEze Telehealth. Wraps the Go session API
  and LiveKit's Flutter client behind a clean interface so the AyurEze
  Patient and Doctor apps never depend on either's internals directly.
version: 0.1.0
homepage: https://github.com/appayureze-cloud/ayureze_telehealth
publish_to: "none"

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  livekit_client: ^2.4.1
  http: ^1.2.2
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
