name: ayureze-telehealth

networks:
  ayureze-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:

services:
  # ---------------------------------------------------------------------
  # Core data stores
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ayureze_telehealth}
      POSTGRES_USER: ${POSTGRES_USER:-ayureze}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ayureze} -d $${POSTGRES_DB:-ayureze_telehealth}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [ayureze-net]

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [ayureze-net]

  # ---------------------------------------------------------------------
  # Real-time media (SFU) + TURN
  # ---------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    # LiveKit is configured entirely through LIVEKIT_CONFIG here (rather than
    # a mounted file) so the Redis password from .env can be injected without
    # ever being written to a committed file. The structural settings below
    # must be kept in sync with infrastructure/livekit/livekit.yaml, which is
    # the reviewable, secret-free reference copy of this same config.
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: ${LIVEKIT_RTC_UDP_PORT_RANGE_START:-50000}
          port_range_end: ${LIVEKIT_RTC_UDP_PORT_RANGE_END:-50100}
          # LIVEKIT_USE_EXTERNAL_IP/LIVEKIT_NODE_IP together select the
          # deployment topology — see docs/deployment/turn-verification.md
          # ("Production topology") for the exact production values this
          # needs, which are NOT known/guessable from this repo alone.
          #   - Local dev (default, unchanged): use_external_ip=false,
          #     node_ip=127.0.0.1 — forces ICE candidates to advertise the
          #     host loopback address (reachable via the docker-compose
          #     port mappings below), since browser clients on the host
          #     cannot route to LiveKit's internal container IP.
          #   - Production (a VPS with a static public IP, the normal case
          #     for a single-VPS deployment — see docs/deployment/
          #     disaster-recovery.md): set LIVEKIT_USE_EXTERNAL_IP=true and
          #     LIVEKIT_NODE_IP=<that public IP> so LiveKit advertises it
          #     directly to clients — no STUN round-trip needed. This repo
          #     cannot supply that IP for you; it is set at deploy time.
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-false}
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
          enable_loopback_candidate: true
        turn:
          enabled: false
        redis:
          address: redis:6379
          password: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        room:
          auto_create: false
          empty_timeout: 300
          departure_timeout: 20
        webhook:
          api_key: "${LIVEKIT_API_KEY}"
          urls:
            - http://api:8080/internal/webhooks/livekit
        logging:
          json: true
          level: info
        prometheus:
          port: 6789
        development: true
    ports:
      - "${LIVEKIT_HTTP_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_RTC_UDP_PORT_RANGE_START:-50000}-${LIVEKIT_RTC_UDP_PORT_RANGE_END:-50100}:${LIVEKIT_RTC_UDP_PORT_RANGE_START:-50000}-${LIVEKIT_RTC_UDP_PORT_RANGE_END:-50100}/udp"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:7880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [ayureze-net]

  coturn:
    image: coturn/coturn:4.6.2-alpine
    restart: unless-stopped
    # COTURN_EXTERNAL_IP is unset/empty by default (local dev, unchanged
    # behavior — the flag below then evaluates to nothing, confirmed via
    # `docker compose config`). Production (coturn running in Docker on a
    # VPS whose public IP is NOT the container's own address, the normal
    # case) MUST set it to that VPS's real public IP, so coturn reports a
    # reachable relay address to clients instead of its internal Docker
    # network IP — see docs/deployment/turn-verification.md ("Production
    # topology"). This repo cannot supply that IP for you.
    command: >
      -c /etc/coturn/turnserver.conf
      --realm=${TURN_REALM:-ayureze.local}
      --use-auth-secret
      --static-auth-secret=${TURN_STATIC_AUTH_SECRET:?TURN_STATIC_AUTH_SECRET is required}
      --min-port=${TURN_MIN_PORT:-49160}
      --max-port=${TURN_MAX_PORT:-49200}
      --listening-port=${TURN_LISTEN_PORT:-3478}
      ${COTURN_EXTERNAL_IP:+--external-ip=${COTURN_EXTERNAL_IP}}
    ports:
      - "${TURN_LISTEN_PORT:-3478}:3478"
      - "${TURN_LISTEN_PORT:-3478}:3478/udp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}/udp"
    volumes:
      - ../coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    networks: [ayureze-net]

  # ---------------------------------------------------------------------
  # Application services (Day 7: containerized via apps/api/Dockerfile and
  # apps/ai-agent/Dockerfile — previously host-run only in local dev).
  # ---------------------------------------------------------------------
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    image: ayureze-api:latest
    restart: unless-stopped
    environment:
      API_HTTP_PORT: "8080"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_CORS_ALLOWED_ORIGINS: ${API_CORS_ALLOWED_ORIGINS:-}
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      DATABASE_URL: postgres://${POSTGRES_USER:-ayureze}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ayureze_telehealth}?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      API_JWT_SIGNING_SECRET: ${API_JWT_SIGNING_SECRET:?API_JWT_SIGNING_SECRET is required}
      API_E2EE_MASTER_KEY_HEX: ${API_E2EE_MASTER_KEY_HEX:?API_E2EE_MASTER_KEY_HEX is required}
      AI_AGENT_SERVICE_SECRET: ${AI_AGENT_SERVICE_SECRET:?AI_AGENT_SERVICE_SECRET is required}
      API_ACCESS_TOKEN_TTL_SECONDS: ${API_ACCESS_TOKEN_TTL_SECONDS:-300}
      API_REFRESH_TOKEN_TTL_SECONDS: ${API_REFRESH_TOKEN_TTL_SECONDS:-604800}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
    ports:
      - "${API_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    networks: [ayureze-net]

  ai-agent:
    build:
      context: ../../apps/ai-agent
      dockerfile: Dockerfile
      args:
        PIPELINE: ${AI_AGENT_ENABLE_PIPELINE:-false}
    image: ayureze-ai-agent:latest
    restart: unless-stopped
    environment:
      AI_AGENT_HTTP_PORT: "8090"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${AI_AGENT_LOG_LEVEL:-INFO}
      API_BASE_URL: http://api:8080
      AI_AGENT_SERVICE_SECRET: ${AI_AGENT_SERVICE_SECRET:?AI_AGENT_SERVICE_SECRET is required}
      LIVEKIT_URL: ws://livekit:7880
      AI_AGENT_ENABLE_PIPELINE: ${AI_AGENT_ENABLE_PIPELINE:-false}
    ports:
      - "${AI_AGENT_HTTP_PORT:-8090}:8090"
    # Model weights (~2.5GB, gitignored — see scripts/download_models.sh)
    # are never baked into the image; mount them here when
    # AI_AGENT_ENABLE_PIPELINE=true.
    volumes:
      - ../../apps/ai-agent/models:/app/models:ro
    depends_on:
      api:
        condition: service_started
    networks: [ayureze-net]

  # ---------------------------------------------------------------------
  # Observability (built in from Day 1; never blocks core services)
  # ---------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../../observability/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # collector self-telemetry (Prometheus)
      - "8889:8889"   # forwarded app metrics (Prometheus)
    networks: [ayureze-net]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--enable-feature=expand-env-vars"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_HTTP_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [ayureze-net]

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ../../observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_HTTP_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [ayureze-net]

  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ../../observability/loki/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    networks: [ayureze-net]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HTTP_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [ayureze-net]
