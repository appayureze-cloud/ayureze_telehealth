# AyurEze Telehealth — coturn baseline configuration
#
# Secrets (static-auth-secret, realm) are NOT stored here. They are passed
# as CLI overrides from docker-compose (infrastructure/docker/docker-compose.yml)
# sourced from the root .env file, keeping this file safe to commit.

listening-ip=0.0.0.0
relay-ip=0.0.0.0

fingerprint
lt-cred-mech
use-auth-secret

# Security hardening
no-loopback-peers
no-multicast-peers
stale-nonce=600
no-cli
no-tlsv1
no-tlsv1_1

# Deny relaying to RFC1918 / loopback / link-local ranges to prevent the
# TURN relay being abused as an internal network pivot (SSRF-style abuse).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

verbose
log-file=stdout
simple-log
