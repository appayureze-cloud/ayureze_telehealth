server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

    pipeline_stages:
      - json:
          expressions:
            level: level
            event_type: event_type
            request_id: request_id
            trace_id: trace_id
            session_id: session_id
            tenant_id: tenant_id

      # Defense-in-depth: never let a secret/token/key value reach Loki even
      # if a service accidentally logs one. Services themselves must already
      # redact these (see docs/monitoring/privacy.md) — this is a backstop,
      # not the primary control.
      - replace:
          expression: '(?i)("?(password|secret|token|api[_-]?key|e2ee[_-]?key)"?\s*[:=]\s*")[^"]*(")'
          replace: '${1}[REDACTED]${3}'

      - labels:
          level:
          event_type:
          service:
