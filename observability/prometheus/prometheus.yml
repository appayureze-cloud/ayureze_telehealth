global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: ${ENVIRONMENT:-development}

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: livekit
    metrics_path: /metrics
    static_configs:
      - targets: ["livekit:6789"]

  - job_name: otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: otel-collector-forwarded
    static_configs:
      - targets: ["otel-collector:8889"]

  # apps/api (Go) — added Day 3, exposes /metrics on API_HTTP_PORT
  - job_name: ayureze-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  # apps/ai-agent (Python/FastAPI) — added Day 5/6
  - job_name: ayureze-ai-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-agent:8090"]
